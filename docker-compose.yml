services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: universal_invoice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@db:5432/universal_invoice
      REDIS_URL: redis://redis:6379
      AUTH_MODE: jwt
      APP_PUBLIC_BASE_URL: https://yourdomain.com
      APP_FRONTEND_URL: https://yourdomain.com
      AUTH_JWT_SECRET: change-me-to-a-secure-random-string
      EMAIL_PROVIDER: smtp
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: user@example.com
      SMTP_PASS: changeme
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: sk_test_changeme
    ports:
      - "80:80"
      - "4000:4000"
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet:
    driver: bridge
