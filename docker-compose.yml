version: "3.8"

services:
  web:
    build: .
    image: universal-invoice-generator:latest
    ports:
      - "80:80"
      - "4000:4000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/invoice_prod
      - APP_ENV=production
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET to a strong random value}
      - APP_PUBLIC_BASE_URL=${APP_PUBLIC_BASE_URL:?set APP_PUBLIC_BASE_URL to your public https URL}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-}
      - EMAIL_PROVIDER=stub
      - PDF_PROVIDER=html
      - PAYMENT_PROVIDER=stub
      - TAX_PROVIDER=manual
      - AI_PROVIDER=stub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoice_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
