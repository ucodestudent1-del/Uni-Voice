<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="description" content="Professional invoice creation and management. Create, send, and track invoices in seconds. Free plan includes everything you need to get started." />
    <meta name="keywords" content="invoice, invoicing, invoice generator, billing, accounting, payments, quotes, small business, freelancer" />
    <meta name="author" content="InvoiceFlow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvoiceFlow" />

    <!-- Open Graph -->
    <meta property="og:title" content="InvoiceFlow — Professional Invoice Generator" />
    <meta property="og:description" content="Create, send, and track invoices in seconds. Free plan includes everything you need to get started." />
    <meta property="og:image" content="https://invoiceflow.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InvoiceFlow — Professional invoice management" />
    <meta property="og:url" content="https://invoiceflow.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en-US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InvoiceFlow — Professional Invoice Generator" />
    <meta name="twitter:description" content="Create, send, and track invoices in seconds. Free plan includes everything you need to get started." />
    <meta name="twitter:image" content="https://invoiceflow.app/og-image.png" />
    <meta name="twitter:image:alt" content="InvoiceFlow — Professional invoice management" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://invoiceflow.app/" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://api.invoiceflow.app" />
    <link rel="preconnect" href="https://plausible.io" />
    <link rel="preconnect" href="https://sentry.io" />
    <link rel="preconnect" href="https://js.stripe.com" />

    <!-- Manifest for PWA support -->
    <link rel="manifest" href="/manifest.json" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "InvoiceFlow",
        "url": "https://invoiceflow.app/",
        "description": "Professional invoice creation and management. Create, send, and track invoices in seconds.",
        "publisher": {
          "@type": "Organization",
          "name": "InvoiceFlow",
          "logo": {
            "@type": "ImageObject",
            "url": "https://invoiceflow.app/favicon.svg"
          }
        },
        "sameAs": [
          "https://twitter.com/invoiceflow",
          "https://github.com/invoiceflow"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://invoiceflow.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "InvoiceFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan available. Pro plan from $19/month."
        }
      }
    </script>

    <title>InvoiceFlow — Professional Invoice Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
