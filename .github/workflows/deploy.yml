name: Deploy

on:
  push:
    branches: [main, master]

env:
  NODE_VERSION: 20

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            universal-invoice-generator:latest
            universal-invoice-generator:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        run: |
          echo "Image pushed to DockerHub as universal-invoice-generator:${{ github.sha }}"
          echo "Deploy by pulling on your server:"
          echo "  docker pull universal-invoice-generator:${{ github.sha }}"
          echo "  docker compose up -d"
